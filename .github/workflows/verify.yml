name: Verificar y desplegar Namecheap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: namecheap-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm run check

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.NAMECHEAP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NAMECHEAP_HOST: ${{ secrets.NAMECHEAP_HOST }}
      NAMECHEAP_USER: ${{ secrets.NAMECHEAP_USER }}
      NAMECHEAP_SSH_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
      NAMECHEAP_KNOWN_HOSTS: ${{ secrets.NAMECHEAP_KNOWN_HOSTS }}
      NAMECHEAP_APP_ROOT: ${{ secrets.NAMECHEAP_APP_ROOT }}
      NAMECHEAP_NODE_ENV: ${{ secrets.NAMECHEAP_NODE_ENV }}
      NAMECHEAP_PORT: ${{ vars.NAMECHEAP_PORT || '21098' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar el paquete y conectar por SSH
        shell: bash
        run: |
          set -euo pipefail
          for name in NAMECHEAP_HOST NAMECHEAP_USER NAMECHEAP_SSH_KEY NAMECHEAP_KNOWN_HOSTS NAMECHEAP_APP_ROOT NAMECHEAP_NODE_ENV; do
            [[ -n "${!name}" ]] || { echo "Falta configurar el secreto $name" >&2; exit 1; }
          done
          [[ "$NAMECHEAP_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || exit 1
          [[ "$NAMECHEAP_USER" =~ ^[A-Za-z0-9_]+$ ]] || exit 1
          [[ "$NAMECHEAP_PORT" =~ ^[0-9]+$ && "$NAMECHEAP_PORT" -ge 1 && "$NAMECHEAP_PORT" -le 65535 ]] || exit 1
          [[ "$NAMECHEAP_APP_ROOT" =~ ^/home/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$ ]] || exit 1
          [[ "$NAMECHEAP_NODE_ENV" =~ ^/home/[A-Za-z0-9_.-]+/nodevenv/[A-Za-z0-9_./-]+/bin/activate$ ]] || exit 1
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/namecheap-ssh.XXXXXXXX")"
          chmod 700 "$ssh_dir"
          printf '%s\n' "$NAMECHEAP_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$NAMECHEAP_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh_opts=(-i "$ssh_dir/key" -p "$NAMECHEAP_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15)
          destination="$NAMECHEAP_USER@$NAMECHEAP_HOST"
          remote_stage="$(ssh "${ssh_opts[@]}" "$destination" 'mktemp -d /tmp/gympass-upload.XXXXXXXX')"
          [[ "$remote_stage" =~ ^/tmp/gympass-upload\.[A-Za-z0-9]+$ ]] || exit 1
          tar -czf release.tar.gz app.js package.json package-lock.json server lib scripts dist
          scp -i "$ssh_dir/key" -P "$NAMECHEAP_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" release.tar.gz "$destination:$remote_stage/release.tar.gz"
          ssh "${ssh_opts[@]}" "$destination" "bash -s -- '$NAMECHEAP_APP_ROOT' '$NAMECHEAP_NODE_ENV' '$remote_stage/release.tar.gz' '$GITHUB_SHA'" < scripts/deploy-namecheap.sh
      - name: Comprobar el dominio al terminar
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --max-time 15 https://gympass.site/api/health > health.json
          node -e 'const fs=require("node:fs");const h=JSON.parse(fs.readFileSync("health.json","utf8"));if(!h.ok||h.mode!=="platform")process.exit(1);console.log("GymPASS responde correctamente en el dominio.")'
